map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
  server_name cinderring.tech www.cinderring.tech;
  root /var/www/cinderring;
  index index.html;
  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; }
  # PeerJS signaling (websocket)
  location /peerjs/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  # short-lived TURN credentials
  location = /turn-credentials { proxy_pass http://127.0.0.1:9001/; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cinderring.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cinderring.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.cinderring.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cinderring.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name cinderring.tech www.cinderring.tech;
    return 404; # managed by Certbot




}